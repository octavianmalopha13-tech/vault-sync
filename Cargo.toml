[package]
name = "vault-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
reqwest = "0.13.5"
rpassword = "7.5.4"
serde_json = "1.0.151"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["full"] }
vault-core = { version = "0.1.0", path = "../vault-core" }
zeroize = "1.9.0"

[profile.dev]
lto = true
